<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      THE READ-ONLY VIEWER for a Makullveny published book or blueprint.

      WHAT THIS PAGE MAY NEVER CONTAIN: no user content committed to this
      repo (everything is fetched at runtime), no service-role key, no object
      key that reveals identity, no authenticated database client — one fetch,
      to one function, with one opaque token. See read.js's header for the
      full accounting; this file only adds two rendering modes (book.js,
      blueprint.js) on top of that same fetch and the same sanitizer.

      THE TOKEN IS IN THE FRAGMENT (never sent to a server, never in Referer).
      THE SANITIZER IS A SECOND, INDEPENDENT ALLOWLIST WALK for book pages; the
      blueprint viewer never parses markup at all — it builds SVG node-by-node
      from validated numbers and colors.

      NO BUILD STEP. Plain HTML, plain CSS, plain ES5-compatible JS.
    -->
    <title>Makullveny — a shared item</title>
    <meta name="referrer" content="no-referrer">
    <!-- img-src is 'self', not 'none': the sanitizer's ALLOWED_TAGS has no IMG
         at all (book) and the blueprint viewer builds SVG by hand with no
         external references, so this only ever loads this repo's own favicon
         — never anything from the fetched snapshot. -->
    <!-- connect-src is ONE EXACT ORIGIN, not `https:`. The shared TDG-core
         Supabase project URL is a public value — a publishable project URL
         appears in every client request — so pinning it here costs nothing and
         means a tampered or mis-deployed read/config.js cannot make this page
         POST the reader's token to some other host. read.js carries the same
         origin in ALLOWED_API_ORIGINS and refuses before the request is even
         opened; the two MUST be changed together. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src https://ddbksawvchsauiuiwvrl.supabase.co; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./read.css">
    <link rel="stylesheet" href="./scene.css">
  </head>
  <body>
    <!-- OPEN GRAPH IS WRITTEN BY read.js, NEVER HERE — see read.js. -->
    <header class="reader-top">
      <a class="reader-brand" href="../" aria-label="Makullveny">
        <span aria-hidden="true">&#127794;</span>
        <span>Makullveny</span>
      </a>
      <button id="readerPrint" class="reader-print" type="button" hidden>Print</button>
    </header>

    <main id="readerMain" class="reader-main">
      <p id="readerState" class="reader-state" role="status" aria-live="polite">Opening&#8230;</p>

      <article id="readerArticle" class="reader-article" hidden>
        <p id="readerPreviewBadge" class="reader-preview-badge" hidden>Preview &mdash; not published</p>

        <!-- ── the book experience ─────────────────────────────────────── -->
        <section id="bookScene" class="book-scene" hidden>
          <div class="book-desk">
            <div class="candle" aria-hidden="true">
              <span class="candle-glow"></span>
              <span class="candle-flame"></span>
              <span class="candle-wick"></span>
              <span class="candle-body"></span>
            </div>

            <div id="bookCover" class="book-cover" tabindex="0" role="button" aria-label="Open the book">
              <h1 id="bookCoverTitle" class="book-cover-title"></h1>
              <p id="bookCoverByline" class="book-cover-byline" hidden></p>
              <span class="book-cover-hint">Tap or press Enter to open</span>
            </div>

            <div id="bookReading" class="book-reading" hidden>
              <div class="book-toolbar">
                <h1 id="bookTitle" class="book-title"></h1>
                <p id="bookByline" class="book-byline" hidden></p>
                <p id="bookDescription" class="book-description" hidden></p>
              </div>
              <div id="bookViewport" class="book-viewport" tabindex="-1">
                <div id="bookLeaves" class="book-leaves"></div>
              </div>
              <div class="book-controls" role="group" aria-label="Book controls">
                <button type="button" id="bookPrev" aria-label="Previous page">&#8592;</button>
                <span id="bookPageIndicator" class="reader-indicator" aria-live="polite"></span>
                <button type="button" id="bookNext" aria-label="Next page">&#8594;</button>
                <span class="reader-controls-sep" aria-hidden="true"></span>
                <button type="button" id="bookZoomOut" aria-label="Zoom out">&#8722;</button>
                <button type="button" id="bookZoomReset" aria-label="Reset zoom">100%</button>
                <button type="button" id="bookZoomIn" aria-label="Zoom in">+</button>
                <button type="button" id="bookZoomFit" aria-label="Fit to view">Fit</button>
                <button type="button" id="bookSound" aria-pressed="false" aria-label="Page-turn sound: off">Sound: Off</button>
              </div>
              <section id="bookCredits" class="reader-credits" hidden>
                <h2 class="reader-credits-title">Credits</h2>
                <ul id="bookCreditsList" class="reader-credits-list"></ul>
              </section>
            </div>
          </div>
        </section>

        <!-- ── the blueprint experience ────────────────────────────────── -->
        <section id="blueprintScene" class="blueprint-scene" hidden>
          <div class="blueprint-desk">
            <div class="blueprint-header">
              <h1 id="blueprintTitle" class="blueprint-title"></h1>
              <p id="blueprintByline" class="blueprint-byline" hidden></p>
              <p id="blueprintDescription" class="blueprint-description" hidden></p>
              <p id="blueprintScale" class="blueprint-scale" hidden></p>
            </div>
            <div id="blueprintViewport" class="blueprint-viewport" tabindex="-1">
              <div id="blueprintSheetWrap" class="blueprint-sheet-wrap"></div>
            </div>
            <div class="blueprint-controls" role="group" aria-label="Blueprint controls">
              <button type="button" id="bpPrev" aria-label="Previous sheet">&#8592;</button>
              <span id="bpSheetIndicator" class="reader-indicator" aria-live="polite"></span>
              <button type="button" id="bpNext" aria-label="Next sheet">&#8594;</button>
              <span class="reader-controls-sep" aria-hidden="true"></span>
              <button type="button" id="bpZoomOut" aria-label="Zoom out">&#8722;</button>
              <button type="button" id="bpZoomReset" aria-label="Reset zoom">100%</button>
              <button type="button" id="bpZoomIn" aria-label="Zoom in">+</button>
              <button type="button" id="bpZoomFit" aria-label="Fit to view">Fit</button>
            </div>
            <section id="blueprintCredits" class="reader-credits" hidden>
              <h2 class="reader-credits-title">Credits</h2>
              <ul id="blueprintCreditsList" class="reader-credits-list"></ul>
            </section>
          </div>
        </section>
      </article>
    </main>

    <footer class="reader-foot">
      <p>
        Shared from <a href="../">Makullveny</a>, a local-first study app.
        This is a read-only copy the writer chose to publish.
      </p>
    </footer>

    <!-- DEPLOY-TIME CONFIG, LOADED BEFORE THE VIEWER. See read/config.js.
         book.js and blueprint.js load BEFORE read.js on purpose: they define
         window.MakullvenyBookReader / MakullvenyBlueprintReader unconditionally
         at load time but only look up window.MakullvenyReader lazily, inside
         render() — see book.js's header comment. read.js is the one that sets
         window.MakullvenyReader and is the only file that calls render(), so
         it must run last. -->
    <script src="./config.js"></script>
    <script src="./book.js"></script>
    <script src="./blueprint.js"></script>
    <script src="./read.js"></script>
  </body>
</html>
