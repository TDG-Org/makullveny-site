<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      GitHub Pages serves this for any path it does not have. It must be at the
      REPOSITORY ROOT and named exactly 404.html -- a nested one is never used.

      Deliberately self-contained: a 404 is very often the first page somebody
      sees (a stale link, a typo, an old bookmark), and a broken stylesheet on
      the page that explains a broken link is a bad joke. No external CSS, no
      script, no fonts.
    -->
    <meta name="robots" content="noindex, follow">
    <title>Makullveny — page not found</title>
    <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f1e7; --panel: #fffdf8; --ink: #2b2117;
        --muted: #6b5c4a; --line: #e2d6c2; --accent: #8a5a2b; --on-accent: #fffdf8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191512; --panel: #221d18; --ink: #f2e9dc;
          --muted: #b6a795; --line: #38302a; --accent: #d9a066; --on-accent: #191512;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--ink);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        width: 100%; max-width: 30rem; background: var(--panel);
        border: 1px solid var(--line); border-radius: 18px; padding: 28px 26px 24px;
        box-shadow: 0 12px 32px rgb(0 0 0 / 8%);
      }
      .mark {
        width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px;
        background: var(--accent); color: var(--on-accent); font-size: 22px; margin-bottom: 16px;
      }
      h1 { margin: 0 0 10px; font-size: 1.4rem; line-height: 1.25; }
      p { margin: 0 0 14px; color: var(--muted); }
      p.lead { color: var(--ink); }
      a.button {
        display: block; margin: 20px 0 12px; padding: 13px 18px; border-radius: 11px;
        background: var(--accent); color: var(--on-accent); font-weight: 600;
        text-align: center; text-decoration: none; min-height: 44px;
      }
      a.button:hover { filter: brightness(1.06); }
      a.button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      .fine { font-size: 0.86rem; margin-bottom: 0; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">?</div>
      <h1>That page isn&#8217;t here</h1>
      <p class="lead">The link may be old, or the address may have a typo in it.</p>
      <a class="button" href="/">Go to Makullveny</a>
      <hr>
      <p class="fine">
        Looking for a book somebody shared with you? Those links look like
        <strong>/read/</strong> followed by a code &mdash; ask them to send it again,
        since a shared link can also be turned off by whoever made it.
      </p>
    </main>
  </body>
</html>
