<!doctype html>
<html lang="en" data-theme="cozy-cabin" data-bg="on">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      A FRIEND GROUP'S CALENDAR, SHARED BY LINK: https://www.makullveny.com/g/#<token>

      The group's owner made this link in the Makullveny app. It shows the
      group's week (or month): each person's classes and the events they
      added, in that person's colour, in the group's own theme. Look only --
      nothing here can change the group. Names are display names; there is
      never an account id, a username, a room or an assignment on it.

      SAME RULES AS u/ AND read/: no key of any kind, one POST to one function
      at one pinned origin (the same read/config.js, the same
      ALLOWED_API_ORIGINS check, the same connect-src below), the token in the
      FRAGMENT so no server and no Referer ever sees it, and every string from
      the network set with textContent. The colours are ../u/themes.css (read
      out of the app) and the frame is ../u/profile.css. NO BUILD STEP.
    -->
    <title>Makullveny — a group calendar</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src https://ddbksawvchsauiuiwvrl.supabase.co; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../u/themes.css">
    <link rel="stylesheet" href="../u/profile.css">
    <link rel="stylesheet" href="./group.css">
  </head>
  <body>
    <header class="pp-top">
      <a class="pp-brand" href="../"><img src="../assets/site/mark.webp" alt="" width="28" height="28">Makullveny</a>
      <div class="pp-actions"><a class="pp-get" href="../#download">Get the app</a></div>
    </header>

    <main class="pp-main" id="gcMain">
      <p id="gcState" class="pp-state" role="status" aria-live="polite">Opening&#8230;</p>
      <div id="gcGroup" class="gp" hidden></div>
    </main>

    <footer class="pp-foot">
      <p>Shared from <a href="../">Makullveny</a>, a local-first study app. The group's owner made this link and can turn it off at any time.</p>
    </footer>

    <script src="../read/config.js"></script>
    <script src="./group.js"></script>
  </body>
</html>
