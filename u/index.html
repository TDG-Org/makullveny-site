<!doctype html>
<html lang="en" data-theme="cozy-cabin" data-bg="on">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      A STUDENT'S PROFILE LINK: https://www.makullveny.com/u/#<token>

      The student made this link in the Makullveny app and picked what it
      shows: their week, their classes, how many achievements they have, their
      Selah library, a short bio. Their name, @username and avatar are always
      on it. Rooms, notes and assignments never are -- the app does not send
      them, the database drops a room if one arrives, and the server function
      forwards named fields only.

      IT LOOKS LIKE THE APP BECAUSE IT IS THE APP'S RENDERER: profile-view.js
      and profile-view.css are byte copies of the app's, and themes.css holds
      every theme's colours as the app computes them. The student's theme,
      background on/off, widget order and widths come with the link.

      SAME RULES AS read/: no key of any kind, one POST to one function at one
      pinned origin (the same read/config.js, the same ALLOWED_API_ORIGINS
      check, the same connect-src below), the token in the FRAGMENT so no
      server and no Referer ever sees it, and every string from the network
      set with textContent. NO BUILD STEP.
    -->
    <title>Makullveny — a student's profile</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src https://ddbksawvchsauiuiwvrl.supabase.co; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./themes.css">
    <link rel="stylesheet" href="./profile-view.css">
    <link rel="stylesheet" href="./profile.css">
  </head>
  <body>
    <header class="pp-top">
      <a class="pp-brand" href="../">Makullveny</a>
      <a class="pp-get" href="../#download">Get the app</a>
    </header>

    <main class="pp-main" id="ppMain">
      <p id="ppState" class="pp-state" role="status" aria-live="polite">Opening&#8230;</p>
      <div id="ppProfile" class="pp-profile" hidden></div>
    </main>

    <footer class="pp-foot">
      <p>Shared from <a href="../">Makullveny</a>, a local-first study app. The student chose what this page shows and can turn it off at any time.</p>
    </footer>

    <script src="../read/config.js"></script>
    <script src="./profile-view.js"></script>
    <script src="./profile.js"></script>
  </body>
</html>
